<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{siteName}} | {{subtitle}}</title>
  <meta name="description" content="{{subtitle}}">{{canonical}}
  <style>
    :root {
      color-scheme: light dark;
      --background: #f7faf9;
      --surface: #eef5f2;
      --ink: #142522;
      --muted: #415a54;
      --rule: #c9dbd4;
      --link: #076456;
      --button: #076456;
      --button-ink: #fafcfa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #121b19;
        --surface: #1a2723;
        --ink: #edf7f2;
        --muted: #b3c8bf;
        --rule: #3b5048;
        --link: #8bdac6;
        --button: #8bdac6;
        --button-ink: #10251e;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--ink); font: 1rem/1.6 system-ui, sans-serif; }
    a { color: var(--link); }
    a:focus-visible { outline: 2px solid var(--link); outline-offset: 4px; }
    h1, h2, p { margin: 0; overflow-wrap: anywhere; }
    .wrap { width: min(68rem, calc(100% - 3rem)); margin-inline: auto; }
    header { border-bottom: 1px solid var(--rule); }
    nav { min-height: 4rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    nav img { display: block; }
    nav a { display: inline-flex; align-items: center; min-height: 2.75rem; font-weight: 600; }
    .intro { padding-block: 5rem 4.5rem; text-align: center; }
    .intro img { display: block; margin: 0 auto 1.25rem; object-fit: contain; }
    h1 { font-size: 3.5rem; line-height: 1.12; text-wrap: balance; }
    .subtitle { margin: .75rem auto 1.75rem; max-width: 36rem; color: var(--muted); font-size: 1.125rem; }
    .primary { display: inline-flex; align-items: center; justify-content: center; min-height: 2.75rem; padding: .55rem 1.35rem; border-radius: .5rem; background: var(--button); color: var(--button-ink); font-weight: 650; text-decoration: none; }
    .primary:hover { text-decoration: underline; text-underline-offset: .2em; }
    .details { border-block: 1px solid var(--rule); background: var(--surface); }
    .details .wrap { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2rem; padding-block: 2rem; }
    h2 { margin-bottom: .4rem; font-size: 1.125rem; }
    .details p, footer { color: var(--muted); font-size: .9375rem; }
    footer { padding-block: 1.5rem; text-align: center; overflow-wrap: anywhere; }
    @media (max-width: 43rem) {
      .wrap { width: calc(100% - 2rem); }
      .intro { padding-block: 3.5rem 3rem; }
      h1 { font-size: 2.5rem; }
      .details .wrap { grid-template-columns: minmax(0, 1fr); gap: 1.25rem; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="wrap">
      <a href="/"><img src="{{logo}}" alt="{{siteName}}" width="36" height="36"></a>
      <a href="/login">{{home.login}}</a>
    </nav>
  </header>
  <main>
    <section class="intro wrap">
      <img src="{{logo}}" alt="" width="80" height="80">
      <h1>{{siteName}}</h1>
      <p class="subtitle">{{subtitle}}</p>
      <a class="primary" href="/login">{{home.getStarted}}</a>
    </section>
    <section class="details">
      <div class="wrap">
        <div>
          <h2>{{home.features.unifiedGateway}}</h2>
          <p>{{home.features.unifiedGatewayDesc}}</p>
        </div>
        <div>
          <h2>{{home.features.multiAccount}}</h2>
          <p>{{home.features.multiAccountDesc}}</p>
        </div>
        <div>
          <h2>{{home.features.balanceQuota}}</h2>
          <p>{{home.features.balanceQuotaDesc}}</p>
        </div>
      </div>
    </section>
  </main>
  <footer class="wrap">{{siteName}}</footer>
</body>
</html>
